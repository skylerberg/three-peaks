name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and database-free. Runs beside the suites so a lint error does not wait
  # on them, and they do not wait on it.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          # No cache-dependency-path: one lockfile, at the default location.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run knip

      # openapi:dump uses --env-file-if-exists and touches no database, so the
      # drift check needs neither an env file nor Postgres.
      - name: 'Regenerate the API client'
        run: pnpm run generate
      - name: 'Committed client is up to date'
        run: |
          git diff --exit-code -- packages/shared/src/api \
            || { echo '::error::The generated client is stale. Run `pnpm run generate` and commit the result.'; exit 1; }

      - run: pnpm run check:comments
      # The shot maths and the library geometry, which import no bpy on purpose,
      # under the runner's own python3 with no Blender to install. The Blender
      # half is tools/blender/smoke.sh, run by hand.
      - run: pnpm run check:scene-shots
      # The document's bounds are written once for the exporter and once for the
      # importer, in two languages that cannot share a file. This reads both.
      - run: pnpm run check:scene-contract
      # Fails if any check:* script is run by neither check:all nor a workflow.
      # This job is a hand-copy of check:all, so it is exactly the list that
      # drifts.
      - run: pnpm run check:scripts
      # Catches a COPY the .dockerignore excludes, which otherwise only an
      # actual image build can see -- and does so before the images job spends
      # a build on it.
      - run: pnpm run check:dockerfiles
      # A client-side kubectl dry-run does not check name or label lengths, and
      # the deploy substitutes a 40-character SHA. This renders the manifests
      # the way the deploy does and checks what the dry-run will not.
      - run: pnpm run check:k8s

  # The suite runs with fileParallelism:false -- files in a run share one
  # database, so they cannot run concurrently. Sharding keeps that rule rather
  # than breaking it: each shard gets its own Postgres and Redis, files stay
  # serial inside a shard, and the shards run in parallel.
  test-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: three_peaks_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Pinned to the tag production runs, so a floating tag cannot
        # green-light semantics the deployment does not have.
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # Node's --env-file hard-errors when the file is missing, so write it. In
      # apps/api, because that is the cwd the test script runs in.
      - name: Write apps/api/.env.test
        run: |
          cat > apps/api/.env.test <<'EOF'
          ENVIRONMENT=test
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=three_peaks_hub_test
          STORAGE_DRIVER=disk
          STORAGE_DISK_ROOT=./data/test-uploads
          REDIS_TEST_URL=redis://127.0.0.1:6379/15
          EOF

      # No `--` before the flag. npm swallows that separator; pnpm forwards it
      # into the script's argv, where vitest reads it as end-of-options and
      # ignores everything after -- so `pnpm test -- --shard=1/2` silently runs
      # the whole suite in every shard and passes green.
      #
      # --filter, not a bare `pnpm test`: at the root that would hand --shard to
      # the web and shared suites too.
      - run: pnpm --filter @three-peaks/api test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # --filter, because playwright is a devDependency of the web app and the
      # root has no node_modules/.bin/playwright to exec.
      - run: pnpm --filter @three-peaks/web exec playwright install --with-deps chromium
      - run: pnpm --filter @three-peaks/shared test
      - run: pnpm --filter @three-peaks/web test
      - run: pnpm --filter @three-peaks/web run build

  # The browser probes, and the only job with an API to drive. They cover what
  # nothing else can: a real file picker, a real WebGL canvas, and axe against a
  # screen that only exists behind a session. Each one skips locally when no API
  # answers and fails here instead, so this job is what makes that promise mean
  # something -- for a year they ran nowhere and the promise was decorative.
  probes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: three_peaks_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @three-peaks/web exec playwright install --with-deps chromium

      # The probes drive the app the way a person does, so this is the real
      # server against a real database, not the test harness.
      - name: Write apps/api/.env
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=17310
          ENVIRONMENT=development
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=three_peaks_hub
          DB_POOL_MAX=10
          STORAGE_DRIVER=disk
          STORAGE_DISK_ROOT=./data/uploads
          CORS_ORIGINS=http://localhost:17300
          APP_URL_BASE=http://localhost:17300
          PASSWORD_RESET_SECRET=ci-only-password-reset-secret
          EMAIL_DRIVER=console
          TRUST_PROXY=false
          TRUST_PROXY_HOPS=1
          EOF

      - run: pnpm run migrate

      - name: Start the API
        run: pnpm run dev:api > /tmp/api.log 2>&1 &

      # /health reaches the database, so waiting for it also waits out the
      # connection coming up -- and a server that never bound fails here rather
      # than as a pile of timeouts inside the probes.
      - name: Wait for the API
        run: |
          for _ in $(seq 60); do
            if curl -fsS http://localhost:17310/health > /dev/null; then
              curl -sS http://localhost:17310/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::The API never became healthy" >&2
          cat /tmp/api.log >&2
          exit 1

      # Before the browser probes: this one boots the artefact the image runs,
      # and nothing else in CI ever does. check:all runs the half of it that
      # needs no database, so the guard count is caught before a push.
      - run: pnpm run check:bundle

      - run: pnpm run check:upload
      - run: pnpm run check:model3d
      - run: pnpm run check:print
      # A real press on a drag handle. jsdom is handed the events the library
      # dispatches; everything between the grip and those events is here.
      - run: pnpm run check:reorder
      # Unpacks the ZIP the export screen builds and reads the .glb files out of
      # it. Every unit test of that path stubs the renderer out, because jsdom
      # has neither a canvas nor WebGL.
      - run: pnpm run check:scene
      - run: pnpm run check:a11y

  # Mutation testing: every guard names a bug and the edit that puts it back,
  # and the named tests must FAIL with that edit in place. A guard whose tests
  # still pass has stopped guarding anything.
  guards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: three_peaks_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Write apps/api/.env.test
        run: |
          cat > apps/api/.env.test <<'EOF'
          ENVIRONMENT=test
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=three_peaks_hub_test
          STORAGE_DRIVER=disk
          STORAGE_DISK_ROOT=./data/test-uploads
          EOF
      - run: pnpm run check:test-guards

  # The Dockerfiles are otherwise unverified until a merge to main triggers a
  # production build. Build both here without pushing, so a broken image fails
  # on the pull request instead.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # Distinct cache scopes. The gha exporter defaults both to `buildkit`, so
      # one image's export overwrites the other's and neither ever hits.
      - name: 'Build the API image'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: 'type=gha,scope=api'
          cache-to: 'type=gha,mode=max,scope=api'
      - name: 'Build the preview-edge image'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/preview-edge/Dockerfile
          push: false
          cache-from: 'type=gha,scope=preview-edge'
          cache-to: 'type=gha,mode=max,scope=preview-edge'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      # -backend=false: validation needs no state and therefore no credentials.
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
