name: Nightly

# The mutation guards, once a night against main rather than on every pull
# request. They are the slowest thing CI ran by several minutes -- the guards
# sharing the test database run one after another -- and what they check is
# that the tests still catch the bugs they were written for, which changes far
# more slowly than the code does. Every pull request still runs the anchor
# check in ci.yaml, so a guard broken by an edit is reported on that edit.
on:
  schedule:
    # 10:00 UTC is the small hours in the Americas.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Mutation testing: every guard names a bug and the edit that puts it back,
  # and the named tests must FAIL with that edit in place. A guard whose tests
  # still pass has stopped guarding anything.
  guards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: three_peaks_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Write apps/api/.env.test
        run: |
          cat > apps/api/.env.test <<'EOF'
          ENVIRONMENT=test
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=three_peaks_hub_test
          STORAGE_DRIVER=disk
          STORAGE_DISK_ROOT=./data/test-uploads
          EOF
      - run: pnpm run check:test-guards
